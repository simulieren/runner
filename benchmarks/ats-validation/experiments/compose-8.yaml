services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: japa-speed-test
    ports: ['127.0.0.1:25432:5432']
    tmpfs: ['/var/lib/postgresql/data']
  redis1:
    image: redis:7-alpine
    ports: ['127.0.0.1:26381:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
